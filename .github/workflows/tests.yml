name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Vérification syntaxique
        run: python -m compileall -q src tests

      - name: Tests hors ligne (aucune ROM requise)
        run: python tests/test_core.py

      - name: Import du module
        run: PYTHONPATH=src python -c "import multitool3ds, multitool3ds.cia, multitool3ds.crypto; print(multitool3ds.__version__)"
